baseURL: "https://rosewwwfr.pages.dev/"  # 修改为你的域名，本地调试可先保留默认
languageCode: "zh-cn"            # 语言代码
theme: "hugo-theme-stack"        # 主题名称，必须与 themes 目录下的文件夹名一致
title: "Rose's Blog"            # 站点标题 (浏览器标签页显示)
copyright: "Rose's Blog"            # 页脚版权信息

# 分页设置：每页显示的文章数量
pagination:
  pagerSize: 5

DefaultContentLanguage: "zh-cn"  # 默认内容语言
hasCJKLanguage: true             # 开启后，中文文章字数统计更准确

languages:
  zh-cn:
    languageName: "中文"
    title: "Rose's Blog"        # 左上角显示的标题
    weight: 1                    # 语言排序权重
    params:
      sidebar:
        subtitle: "日拱一卒，不断精进" # 侧边栏副标题

params:
  # --- 侧边栏配置 ---
  mainSections:
    - post
  featuredImageField: image
  rssFullContent: true
#   favicon: "/favicon.ico"        # 站点图标，放在 static 目录下

  sidebar:
    avatar: "img/avatar.png"     
    emoji: "👾"                  # 头像旁边的 Emoji
    local: true                  # 使用本地头像
    # 社交链接配置 (显示在侧边栏底部)
    social:
      - icon: "github"           # 图标名称 (Stack 内置图标：github, twitter, email 等)
        url: "https://github.com/Rosewwwfr"
      - icon: "email"
        url: "mailto:1320104286@qq.com"

  # --- 页脚配置 ---
  footer:
    since: 2026                 # 建站年份
    customText: ""               # 自定义页脚文本 (支持 HTML)

  # --- 日期格式 ---
  dateFormat:
    published: "2006-01-02"

  # --- 文章列表页配置 ---
  list:
    description: "这里是我的技术分享与生活记录" # 列表页描述
    date: true                   # 显示日期

  # --- 文章详情页配置 ---
  page:
    # 是否显示上一篇/下一篇 文章链接
    navigation: true
    
    # 评论系统配置 (以 Giscus 为例)
    # comments:
    #   provider: "giscus"
    #   giscus:
    #     repo: "你的GitHub用户名/仓库名"
    #     repoID: "你的Repo ID"
    #     category: "Announcements"
    #     categoryID: "你的Category ID"
    #     mapping: "pathname"
    #     reactionsEnabled: "1"
    #     emitMetadata: "0"
    #     inputPosition: "bottom"
    #     lang: "zh-CN"

  # --- 搜索配置 ---
  search:
    enabled: true
    index: true # 索引全文

#   # --- SEO 与 分享 ---
#   opengraph:
#     twitter:
#       card: "summary_large_image" # 推特卡片样式

#   # --- 图片处理 ---
#   imageProcessing:
#     cover:
#       enabled: true
#     content:
#       enabled: true


